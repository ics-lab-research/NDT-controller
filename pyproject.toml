[project]
name = "ndt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "baml-py==0.216.0",
  "dotenv>=0.9.9",
  "gradio>=6.2.0",
  "loguru>=0.7.3",
  "pydantic>=2.12.5",
  "pywin32>=311; sys_platform == 'win32'",
  "pywinauto>=0.6.9; sys_platform == 'win32'",
]


[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
  "catppuccin-jupyterlab>=0.2.4",
  "jupyterlab>=4.4.9",
  "jupyterlab-vim>=4.1.4",
  "pyinstaller>=6.17.0",
]

[project.scripts]
ndt = "src.main:gui"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"ndt" = ["**/*.txt", "**/*.json"]
