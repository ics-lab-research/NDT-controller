[project]
name = "ndt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "dotenv>=0.9.9",
  "loguru>=0.7.3",
  "baml-py==0.215",
  "pydantic>=2.11.7",
  "gradio>=5.48.0",
  "aider-chat>=0.86.1",
  "watchdog>=6.0.0",
  "pywin32>=311; sys_platform == 'win32'",
  "pywinauto>=0.6.9; sys_platform == 'win32'",
]


[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
  "catppuccin-jupyterlab>=0.2.4",
  "jupyterlab>=4.4.9",
  "jupyterlab-vim>=4.1.4",
]

[project.scripts]
ndt = "src.main:gui"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"ndt" = ["**/*.txt", "**/*.json"]
