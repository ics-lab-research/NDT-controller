plans = "labview_experiment_plans.json"
data_dir = "data"
plots_dir = "plots"

[experiment.vi_paths]
single_sensor = "D:\\Dat\\Pulsed Eddy Current - LLM\\MAIN - PECT - Autonics - Pulses - encoder  - LLM.vi"
